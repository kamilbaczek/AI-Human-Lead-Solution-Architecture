services:
  orders-api:
    build: ./src/Orders.Api
    depends_on: [postgres, rabbitmq, redis]
  billing-worker:
    build: ./src/Billing.Worker
    depends_on: [postgres, rabbitmq]
  web:
    build: ./web
    ports: ["5173:5173"]
  postgres:
    image: postgres:16
  rabbitmq:
    image: rabbitmq:3.13-management
  redis:
    image: redis:7
